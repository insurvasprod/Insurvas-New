# Release 1's newer screens, opened by their links after a development sign-in — READ ONLY: it only
# opens screens and takes screenshots. Run with: powershell -File mobile/scripts/e2e-android.ps1 -SignedIn -Email <test account>
appId: host.exp.exponent
---
- launchApp:
    clearState: true
- openLink: "exp://10.0.2.2:8081?__expo_disable_onboarding=1&__expo_disable_fab=1"
- runFlow:
    file: subflows/dismiss-expo-intro.yaml
- extendedWaitUntil:
    visible:
      id: "sign-in-submit"
    timeout: 120000
- openLink: ${MAESTRO_LINK}
- extendedWaitUntil:
    visible: "Transfers waiting|Submitted premium"
    timeout: 90000
- openLink: "exp://10.0.2.2:8081/--/calendar"
- extendedWaitUntil:
    visible: "(January|February|March|April|May|June|July|August|September|October|November|December) 20[0-9][0-9]"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: e2e/screenshots/20-calendar
- openLink: "exp://10.0.2.2:8081/--/call/team"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: e2e/screenshots/21-inbound-team
- openLink: "exp://10.0.2.2:8081/--/notifications"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: e2e/screenshots/22-notifications
- openLink: "exp://10.0.2.2:8081/--/profile"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: e2e/screenshots/23-profile
- openLink: "exp://10.0.2.2:8081/--/menu/help"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: e2e/screenshots/24-help
